context: job-boards
name: Job Boards
intro: >-
  The common job-listing vocabulary -- job postings as they are syndicated and searched, the employers
  posting them, and the salaries attached -- distilled from the APIs that already exist.
tags: [Job, Jobs, Job Boards, Job Search, Careers, Employment, Labor Market]
envelope: [_links, _pagination, _results, data, success, errors, count, total, page, meta, links, result, results, value, next, previous, has_more, message, total_count, object]
common_fields:
  id: [uuid, guid, external_id, job_id, posting_id]
  created_at: [created, created_date, create_time, posted_at, date_posted, published_at, posted_date]
  updated_at: [updated, modified_at, update_time]
  status: [state]
  name: [title, display_name, job_title]
  description: [desc, job_description, summary]
concepts:
  job_posting:
    path: /job-postings
    segments: [jobs, job, postings, posting, job_postings, listings@jobs, vacancies, openings, positions@jobs]
    aliases:
      company: [company_name, employer, employer_name, hiring_organization, organization]
      location: [locations, job_location, city]
      employment_type: [job_type, type, contract_type, schedule]
      salary_min: [min_salary, salary_from, compensation_min]
      salary_max: [max_salary, salary_to, compensation_max]
      remote: [is_remote, remote_ok, workplace_type]
      url: [apply_url, job_url, link, redirect_url]

findings:
  - >-
    Job postings agree on id, name, description and employment_type; company and location reach 47%,
    and salary falls below 30% -- most boards syndicate pay as free text, if at all.
decisions:
  - >-
    The concept is job_posting, because recruiting holds job as the requisition inside an applicant
    tracking system; this is the posting as boards syndicate and search it. schema.org JobPosting is the
    reference shape, and its names are preferred where the census ties.
